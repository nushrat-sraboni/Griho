# .github/workflows/ci.yml
#
# The automatic "guard at the door" (CI = Continuous Integration).
# GitHub runs this on its own computers every time someone opens or updates a
# pull request, and every time something lands on main. It runs the same checks
# you can run yourself with:  npm run check
#   1. Is the code tidy (Prettier)?
#   2. Does the code-spell-checker (ESLint) find mistakes?
#   3. Does TypeScript find type problems?
#   4. Do the tests pass?
# A red result means: do not merge yet.
#
# Database tests (supabase/tests) will be added here when the backend exists.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install libraries
        run: npm ci

      - name: Run all checks
        run: npm run check
